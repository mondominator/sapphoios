name: TestFlight

# Push a tag `vX.Y.Z` (matching MARKETING_VERSION in project.yml) to build,
# sign with match and upload to TestFlight. Build numbers are epoch seconds,
# set by the lane, so they never collide.
#
# Required secrets and settings: docs/CI.md.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  testflight:
    name: Upload to TestFlight
    runs-on: ${{ vars.MACOS_RUNNER || 'macos-26' }}
    # Holds the signing secrets; add required reviewers on it to gate uploads.
    environment: testflight
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history for the changelog

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ vars.XCODE_VERSION || 'latest-stable' }}

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Install XcodeGen
        # Pinned: newer XcodeGen releases write a different pbxproj, which
        # would fail the drift check below against the committed project.
        run: |
          curl -fsSL -o /tmp/xcodegen.zip https://github.com/yonaskolb/XcodeGen/releases/download/2.44.1/xcodegen.zip
          unzip -q /tmp/xcodegen.zip -d /tmp/xcodegen
          echo "/tmp/xcodegen/xcodegen/bin" >> "$GITHUB_PATH"

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Run unit tests
        # Never ship a red build: the tag job runs the same tests as CI first.
        run: |
          RUNTIMES_JSON=$(xcrun simctl list runtimes --json)
          RUNTIME=$(echo "$RUNTIMES_JSON" | jq -r \
            '[.runtimes[] | select(.platform == "iOS" and .isAvailable)]
             | sort_by(.version | split(".") | map(tonumber)) | last | .identifier // empty')
          DEVICE_TYPE=$(echo "$RUNTIMES_JSON" | jq -r --arg r "$RUNTIME" \
            '.runtimes[] | select(.identifier == $r) | .supportedDeviceTypes
             | map(select(.productFamily == "iPhone")) | last | .identifier // empty')
          xcrun simctl create "ci-iphone" "$DEVICE_TYPE" "$RUNTIME"
          bundle exec fastlane ios test destination:"platform=iOS Simulator,name=ci-iphone"

      - name: Build, sign and upload
        env:
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_KEY_CONTENT }}
        run: bundle exec fastlane ios beta

      - name: Upload IPA and dSYM
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Sappho-build
          path: |
            build/*.ipa
            build/*.dSYM.zip
          retention-days: 30
