name: Sappho
options:
  bundleIdPrefix: com.sappho
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"

# DEVELOPMENT_TEAM is declared once here at the project level; all targets
# inherit it. CODE_SIGN_STYLE: Automatic handles identity selection, so no
# CODE_SIGN_IDENTITY overrides are needed.
settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: S6WU9SVVDW
    # Single source of truth for the version (Info.plist reads both via
    # $(MARKETING_VERSION) / $(CURRENT_PROJECT_VERSION)).
    # - MARKETING_VERSION: bump by hand per release (1.0.0 shipped as build 45).
    # - CURRENT_PROJECT_VERSION: CI's `fastlane ios beta` overwrites it with
    #   epoch seconds so every TestFlight upload is unique; the value here is
    #   only for local builds.
    MARKETING_VERSION: 1.0.5
    CURRENT_PROJECT_VERSION: 46
    VERSIONING_SYSTEM: apple-generic

targets:
  Sappho:
    type: application
    platform: iOS
    sources:
      - Sappho
    resources:
      - Sappho/Resources
    attributes:
      ProvisioningStyle: Automatic
    settings:
      base:
        # NOTE: "audiobook" (singular) is the bundle id shipped to the App
        # Store and is IMMUTABLE — do not "fix" it to "audiobooks".
        PRODUCT_BUNDLE_IDENTIFIER: com.sappho.audiobook
        INFOPLIST_FILE: Sappho/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
    entitlements:
      path: Sappho/Resources/Sappho.entitlements
      properties:
        com.apple.developer.carplay-audio: true
        com.apple.security.application-groups:
          - group.com.sappho.audiobooks

  SapphoTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - SapphoTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - target: Sappho

  SapphoUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - SapphoUITests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - target: Sappho

schemes:
  Sappho:
    build:
      targets:
        Sappho: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SapphoTests
        - SapphoUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
